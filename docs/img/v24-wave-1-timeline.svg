<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 270" width="1030" height="270" role="img" aria-label="agent-loop v2.4 wave 1: 5 tasks and the tail. One row per task; bars show worker, critic, CI-wait and merge agents over time.">
<title>agent-loop v2.4 wave 1: 5 tasks and the tail</title>
<style>
.bg{fill:#ffffff}
