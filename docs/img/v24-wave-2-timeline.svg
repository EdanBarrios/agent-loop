<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 270" width="1030" height="270" role="img" aria-label="v2.4 wave 2: 6 tasks over three launches (agent-loop builds itself). One row per task; bars show worker, critic, CI-wait and merge agents over time.">
<title>v2.4 wave 2: 6 tasks over three launches (agent-loop builds itself)</title>
<style>
.bg{fill:#ffffff}
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.id{font-size:12px;font-weight:600}.ttl{font-size:12px;fill:#59636e}.ax{font-size:11px;fill:#59636e}
