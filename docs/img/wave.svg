<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 540" width="990" height="540" role="img" aria-label="One wave of agent-loop: a task spec goes through spec-review, then tasks run in parallel through worker, critic and merge, with FIX looping back to the worker; then the tail task, an integration review, the wave gate and a scorecard.">
<title>One wave of agent-loop</title>
<style>
.bg{fill:#ffffff}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.wk{stroke:#0969da}.cr{stroke:#8250df}.mg{stroke:#1a7f37}.gt{stroke:#1f2328;stroke-width:1.6}
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.b{font-size:14px;font-weight:600}.m{font-size:12px;fill:#59636e}.s{font-size:12px;fill:#59636e}
.h{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
.a{fill:none;stroke:#8c959f;stroke-width:1.4}.fix{fill:none;stroke:#bc4c00;stroke-width:1.4;stroke-dasharray:4 3}
.fx{fill:#bc4c00}#h path{fill:#8c959f}#hf path{fill:#bc4c00}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.box{fill:#151b23;stroke:#3d444d}.wk{stroke:#4493f8}.cr{stroke:#ab7df8}.mg{stroke:#3fb950}.gt{stroke:#f0f6fc}
.t{fill:#f0f6fc}.m,.s,.h{fill:#9198a1}.a{stroke:#656c76}#h path{fill:#656c76}
.fix{stroke:#f0883e}.fx{fill:#f0883e}#hf path{fill:#f0883e}}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>
<marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="990" height="540" rx="8"/>
<text class="t h" x="185" y="60" text-anchor="middle">BEFORE THE WAVE</text>
<text class="t h" x="600" y="60" text-anchor="middle">TASKS IN PARALLEL · ONE GIT WORKTREE EACH</text>
<text class="t h" x="900" y="60" text-anchor="middle">AFTER THE TASKS</text>
<rect class="box" x="20" y="240" width="150" height="90" rx="8"/>
<text class="t b" x="95.0" y="273.0" text-anchor="middle">Task spec</text>
<text class="t m" x="95.0" y="290.0" text-anchor="middle">owned paths,</text>
<text class="t m" x="95.0" y="307.0" text-anchor="middle">acceptance tests</text>
<rect class="box" x="200" y="240" width="150" height="90" rx="8"/>
<text class="t b" x="275.0" y="273.0" text-anchor="middle">spec-review</text>
<text class="t m" x="275.0" y="290.0" text-anchor="middle">reviewer, spikes,</text>
<text class="t m" x="275.0" y="307.0" text-anchor="middle">adversary</text>
<path class="a" d="M170 285 H196" marker-end="url(#h)"/>
<text class="t s" x="275" y="352" text-anchor="middle">questions go to the human</text>
<path class="a" d="M350 285 C 368 285, 362 165, 386 165" marker-end="url(#h)"/>
<rect class="box wk" x="390" y="130" width="130" height="70" rx="8"/>
<text class="t b" x="455.0" y="153.0" text-anchor="middle">Worker</text>
<text class="t m" x="455.0" y="170.0" text-anchor="middle">Sonnet</text>
<text class="t m" x="455.0" y="187.0" text-anchor="middle">opens a PR</text>
<rect class="box cr" x="550" y="130" width="130" height="70" rx="8"/>
<text class="t b" x="615.0" y="153.0" text-anchor="middle">Critic</text>
<text class="t m" x="615.0" y="170.0" text-anchor="middle">Fable, checklist</text>
<text class="t m" x="615.0" y="187.0" text-anchor="middle">MERGE · FIX · STOP</text>
<rect class="box mg" x="710" y="130" width="120" height="70" rx="8"/>
<text class="t b" x="770.0" y="153.0" text-anchor="middle">Merge</text>
<text class="t m" x="770.0" y="170.0" text-anchor="middle">CI wait, sync,</text>
<text class="t m" x="770.0" y="187.0" text-anchor="middle">check on main</text>
<path class="a" d="M520 165 H546" marker-end="url(#h)"/>
<path class="a" d="M680 165 H706" marker-end="url(#h)"/>
<path class="fix" d="M615 130 C 615 100, 455 100, 455 132" marker-end="url(#hf)"/>
<text class="t s fx" x="535" y="106" text-anchor="middle">FIX, at most 3 rounds</text>
<path class="a" d="M830 165 C 846 165, 840 160, 856 160" marker-end="url(#h)"/>
<path class="a" d="M350 285 C 368 285, 362 285, 386 285" marker-end="url(#h)"/>
<rect class="box wk" x="390" y="250" width="130" height="70" rx="8"/>
<text class="t b" x="455.0" y="273.0" text-anchor="middle">Worker</text>
<text class="t m" x="455.0" y="290.0" text-anchor="middle">Sonnet</text>
<text class="t m" x="455.0" y="307.0" text-anchor="middle">opens a PR</text>
<rect class="box cr" x="550" y="250" width="130" height="70" rx="8"/>
<text class="t b" x="615.0" y="273.0" text-anchor="middle">Critic</text>
<text class="t m" x="615.0" y="290.0" text-anchor="middle">Fable, checklist</text>
<text class="t m" x="615.0" y="307.0" text-anchor="middle">MERGE · FIX · STOP</text>
<rect class="box mg" x="710" y="250" width="120" height="70" rx="8"/>
<text class="t b" x="770.0" y="273.0" text-anchor="middle">Merge</text>
<text class="t m" x="770.0" y="290.0" text-anchor="middle">CI wait, sync,</text>
<text class="t m" x="770.0" y="307.0" text-anchor="middle">check on main</text>
<path class="a" d="M520 285 H546" marker-end="url(#h)"/>
<path class="a" d="M680 285 H706" marker-end="url(#h)"/>
<path class="fix" d="M615 250 C 615 220, 455 220, 455 252" marker-end="url(#hf)"/>
<text class="t s fx" x="535" y="226" text-anchor="middle">FIX</text>
<path class="a" d="M830 285 C 846 285, 840 160, 856 160" marker-end="url(#h)"/>
<path class="a" d="M350 285 C 368 285, 362 405, 386 405" marker-end="url(#h)"/>
<rect class="box wk" x="390" y="370" width="130" height="70" rx="8"/>
<text class="t b" x="455.0" y="393.0" text-anchor="middle">Worker</text>
<text class="t m" x="455.0" y="410.0" text-anchor="middle">Sonnet</text>
<text class="t m" x="455.0" y="427.0" text-anchor="middle">opens a PR</text>
<rect class="box cr" x="550" y="370" width="130" height="70" rx="8"/>
<text class="t b" x="615.0" y="393.0" text-anchor="middle">Critic</text>
<text class="t m" x="615.0" y="410.0" text-anchor="middle">Fable, checklist</text>
<text class="t m" x="615.0" y="427.0" text-anchor="middle">MERGE · FIX · STOP</text>
<rect class="box mg" x="710" y="370" width="120" height="70" rx="8"/>
<text class="t b" x="770.0" y="393.0" text-anchor="middle">Merge</text>
<text class="t m" x="770.0" y="410.0" text-anchor="middle">CI wait, sync,</text>
<text class="t m" x="770.0" y="427.0" text-anchor="middle">check on main</text>
<path class="a" d="M520 405 H546" marker-end="url(#h)"/>
<path class="a" d="M680 405 H706" marker-end="url(#h)"/>
<path class="fix" d="M615 370 C 615 340, 455 340, 455 372" marker-end="url(#hf)"/>
<text class="t s fx" x="535" y="346" text-anchor="middle">FIX</text>
<path class="a" d="M830 405 C 846 405, 840 160, 856 160" marker-end="url(#h)"/>
<rect class="box" x="860" y="130" width="120" height="60" rx="8"/>
<text class="t b" x="920.0" y="156.5" text-anchor="middle">Tail task</text>
<text class="t m" x="920.0" y="173.5" text-anchor="middle">runs alone</text>
<rect class="box" x="860" y="220" width="120" height="60" rx="8"/>
<text class="t b" x="920.0" y="246.5" text-anchor="middle">Integration</text>
<text class="t m" x="920.0" y="263.5" text-anchor="middle">review, read-only</text>
<rect class="box gt" x="860" y="310" width="120" height="60" rx="8"/>
<text class="t b" x="920.0" y="336.5" text-anchor="middle">Wave gate</text>
<text class="t m" x="920.0" y="353.5" text-anchor="middle">machine-checked</text>
<rect class="box" x="860" y="400" width="120" height="60" rx="8"/>
<text class="t b" x="920.0" y="426.5" text-anchor="middle">Scorecard</text>
<text class="t m" x="920.0" y="443.5" text-anchor="middle">tunes one role</text>
<path class="a" d="M920 190 V216" marker-end="url(#h)"/>
<path class="a" d="M920 280 V306" marker-end="url(#h)"/>
<path class="a" d="M920 370 V396" marker-end="url(#h)"/>
<text class="t s" x="495" y="505" text-anchor="middle">A STOP, a worker blocked by an ambiguity or a task still failing after its rounds is parked for the human.</text>
<text class="t s" x="495" y="526" text-anchor="middle">Control flow is deterministic JavaScript; models decide only inside a task.</text>
</svg>
